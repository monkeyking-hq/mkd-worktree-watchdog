[package]
name = "mkd-worktree-watchdog"
version = "0.2.0"
edition = "2021"
description = "Rule-based watchdog service and CLI that safely prunes stale git worktrees and reclaims disk space"
license = "MIT"
repository = "https://github.com/monkeyking-hq/mkd-worktree-watchdog"
keywords = ["git", "worktree", "cleanup", "watchdog", "disk-space"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
globset = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
toml = "0.8"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
